<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>…и кофе — табличка</title>
<style>
 @page{size:A5 portrait;margin:0}
 body{margin:0;font-family:-apple-system,'Segoe UI',Roboto,sans-serif}
 .sheet{width:148mm;min-height:210mm;margin:0 auto;background:#F7F4EE;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10mm;box-sizing:border-box}
 h1{font-size:26pt;margin:0;color:#12303E}
 .sea{color:#2E6F8E;font-size:11pt;margin:4px 0 8mm}
 .big{font-size:15pt;font-weight:800;color:#12303E;margin-bottom:6mm}
 img.qr{width:52mm;height:52mm;border-radius:5mm;background:#fff;padding:3mm;box-sizing:border-box}
 .steps{font-size:11pt;color:#41505E;margin-top:6mm;line-height:1.5}
 .gift{margin-top:6mm;font-size:12pt;font-weight:700;color:#2E6F8E}
</style>
</head>
<body>
<div class="sheet">
 <h1>…и кофе</h1>
 <div class="sea">кофейня на берегу моря · п. Янтарный</div>
 <div class="big">Каждый 10-й кофе —<br>за наш счёт 🎁</div>
 <img class="qr" src="https://api.qrserver.com/v1/create-qr-code/?size=600x600&data=https%3A%2F%2Fapp.andcoffee.online%2Finstall.html" alt="QR">
 <div class="steps">1. Отсканируйте QR камерой телефона<br>2. Установите приложение за 10 секунд<br>3. Покажите свой QR кассиру — штампы копятся</div>
 <div class="gift">Штампы, подарки и промокоды — в приложении</div>
</div>
</body>
</html>
