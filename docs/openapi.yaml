openapi: 3.0.3

info:
  title: zerno-app API
  version: 0.2.0
  description: |
    Контракт API PWA «…и кофе» / «Пятница». Собран из docs/api.md
    и фактических роутов server/routes/*.js. Источник правды — серверный код.
    При расхождении — правьте спеку и server/routes/* в одном PR.
  contact:
    name: Zerno App
    url: https://friday.andcoffee.online

servers:
  - url: https://friday.andcoffee.online
    description: Production
  - url: http://localhost:3000
    description: Local dev

tags:
  - name: Auth
  - name: Menu
  - name: Orders
  - name: Staff
  - name: Chat
  - name: Push
  - name: Promos
  - name: Admin
  - name: System

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: 'Authorization: Bearer <token из localStorage zt_user>'

  schemas:
    BonusKind:
      type: object
      description: Бонус одного вида для кофейни и доставки
      properties:
        coffee: { type: integer, minimum: 0, maximum: 10, description: "Штампы в кофейне" }
        delivery: { type: integer, minimum: 0, maximum: 5000, description: "Скидка ₽ в доставке" }
    Customer:
      type: object
      required: [id, name, phone, stamps, free, cups, role]
      properties:
        id:          { type: integer, minimum: 1 }
        name:        { type: string, maxLength: 24 }
        phone:       { type: string, pattern: '^\\+7\\d{10}$' }
        stamps:      { type: integer, minimum: 0, maximum: 10 }
        free:        { type: integer, minimum: 0 }
        cups:        { type: integer, minimum: 0 }
        qr:          { type: string, description: 'Код Z-XXXXXX' }
        role:        { type: string, enum: [guest, cashier, dispatch, admin] }
        verified:    { type: integer, enum: [0, 1] }
        welcome:     { type: integer, enum: [0, 1] }
        tg:          { type: integer, enum: [0, 1] }
        # Добавлено после сверки с server/domain/helpers.js::cust()
        notify_tg:   { type: integer, enum: [0, 1] }
        notify_web:  { type: integer, enum: [0, 1] }
        history:
          type: array
          items:
            type: object
            properties:
              ts: { type: string, format: date-time }
              a:  { type: string }
              by: { type: string }
      additionalProperties: true

    MenuItem:
      type: object
      required: [id, cat, name, price]
      properties:
        id:      { type: integer }
        cat:     { type: string, enum: [coffee, drinks, food, pizza, rolls, snacks] }
        e:       { type: string }
        name:    { type: string, maxLength: 40 }
        desc:    { type: string, maxLength: 140 }
        comp:    { type: array, items: { type: string } }
        vol:     { type: string, maxLength: 14 }
        price:   { type: number, minimum: 0 }
        tag:     { type: string }
        coffee:  { type: integer, enum: [0, 1] }
        on:      { type: integer, enum: [0, 1] }
        img:     { type: string }
        section: { type: string, enum: [coffee, delivery] }
      additionalProperties: true

    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code:  { type: string }

  responses:
    Unauthorized:
      description: Токен отсутствует или недействителен
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

paths:
  /api/health:
    get:
      tags: [System]
      summary: Health-check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { ok: { type: boolean } }

  /api/config:
    get:
      tags: [System]
      summary: Публичный bootstrap-конфиг
      responses:
        '200': { description: OK }

  /api/clientlog:
    post:
      tags: [System]
      summary: Лог клиентских событий
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, msg]
              properties:
                kind: { type: string }
                msg:  { type: string, maxLength: 500 }
      responses: { '200': { description: OK } }

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Регистрация нового гостя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, phone, consent]
              properties:
                name:    { type: string, maxLength: 24 }
                phone:   { type: string }
                pin:     { type: string, pattern: '^\\d{4}$' }
                consent: { type: integer, enum: [0, 1] }
      responses:
        '200':
          description: Профиль создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:    { type: string }
                  customer: { $ref: '#/components/schemas/Customer' }
        '409': { description: Профиль уже существует }

  /api/auth/request-reg-otp:
    post:
      tags: [Auth]
      summary: Запрос OTP для регистрации (SMS или Telegram)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
                name:  { type: string }
                via:   { type: string, enum: [tg, sms] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:    { type: boolean }
                  tgUrl: { type: string }
        '400': { description: Неверный номер }
        '409': { description: Номер уже зарегистрирован }
        '429': { description: Слишком частые запросы }

  /api/auth/check-reg:
    get:
      tags: [Auth]
      summary: Проверка статуса регистрации через Telegram
      parameters:
        - in: query
          name: phone
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  confirmed: { type: boolean }
                  token:     { type: string }
                  customer:  { $ref: '#/components/schemas/Customer' }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Вход по телефону и PIN либо одноразовому Telegram OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string }
                pin: { type: string, pattern: '^\\d{4}$' }
                otp: { type: string, description: Одноразовый код, отправленный в привязанный Telegram }
      responses:
        '200': { description: Возвращает token, customer и возможный needPin }
        '400': { description: Некорректный PIN или PIN отсутствует }
        '403': { description: Неверный или просроченный OTP либо неверный PIN }
        '404': { description: Профиль не найден }
        '409': { description: Требуется первичная установка PIN }
        '429': { description: Слишком много попыток }

  /api/auth/setup-pin:
    post:
      tags: [Auth]
      summary: Первичная установка PIN для существующего профиля
      description: Публичный маршрут; устанавливает PIN только если у профиля он ещё не задан.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, pin]
              properties:
                phone: { type: string }
                pin: { type: string, pattern: '^\\d{4}$' }
      responses:
        '200': { description: Возвращает token и customer }
        '400': { description: Некорректный PIN }
        '403': { description: PIN уже задан }
        '404': { description: Профиль не найден }

  /api/auth/activate-guest:
    post:
      tags: [Auth]
      summary: Активация гостя по коду от кассира
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties: { code: { type: string } }
      responses: { '200': { description: OK } }

  /api/auth/tg-link:
    post:
      tags: [Auth]
      summary: Вход или привязка Telegram initData
      description: Публичный маршрут; проверяет подпись и свежесть initData. При необходимости запускает подтверждение номера телефона в боте.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [initData]
              properties:
                initData: { type: string, description: "Подписанные Telegram данные, действительны один час" }
                phone: { type: string, description: "Номер; привязка по нему возможна только после подтверждения в боте" }
                name: { type: string }
                pin: { type: string }
      responses:
        '200':
          description: >-
            Вход выполнен ({token, customer}), либо needBotConfirm=true с tgUrl: номер нужно подтвердить в боте
            тем же аккаунтом Telegram, затем повторить вызов.
        '401': { description: "Подпись initData неверна или устарела" }
        '400': { description: "Номер введён не полностью" }

  /api/me:
    get:
      tags: [Auth]
      summary: Текущий пользователь
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties: { customer: { $ref: '#/components/schemas/Customer' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Auth]
      summary: Сменить имя гостя
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties: { name: { type: string, maxLength: 24 } }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
    delete:
      tags: [Auth]
      summary: Удалить профиль и персональные данные
      description: |
        Удаляет профиль гостя, токены, push-подписки, историю, чат и промо-использования.
        Заказы сохраняются без имени, телефона, адреса и комментария (обезличиваются) для учёта.
        Сотрудники (admin, cashier, dispatch) не могут удалить себя через приложение.
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, properties: { ok: { type: boolean } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: "Сотрудник не может удалить профиль" }

  /api/menu:
    get:
      tags: [Menu]
      summary: Публичное меню кофейни
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:     { type: array, items: { $ref: '#/components/schemas/MenuItem' } }
                  updatedAt: { type: string, format: date-time }

    post:
      tags: [Menu]
      summary: Создать позицию меню
      description: Только adminGuard; создаёт запись меню и возвращает её id.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Поля новой позиции меню; сервер применяет значения по умолчанию для необязательных полей.
              properties:
                id: { type: string }
                name: { type: string }
                section: { type: string, enum: [coffee, delivery] }
                price: { type: string }
                on: { type: boolean }
                comp: { type: array, items: { type: object } }
                opts: { type: array, items: { type: object } }
      responses:
        '200': { description: Позиция создана; возвращает ok и id }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/menu/reorder:
    put:
      tags: [Menu]
      summary: Изменить порядок позиций меню
      description: Только adminGuard; brand выбирает секцию, ids задаёт новый порядок. Пустой или неполный список отклоняется.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                brand: { type: string, enum: [coffee, delivery] }
                ids: { type: array, items: { type: string }, minItems: 1 }
      responses:
        '200': { description: Порядок обновлён }
        '400': { description: Пустой порядок }
        '409': { description: Не все позиции найдены в выбранной секции }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/menu/all:
    get:
      tags: [Menu]
      summary: Всё меню, включая выключенные позиции (menuGuard: cashier, dispatch, admin)
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/menu/{id}:
    put:
      tags: [Menu]
      summary: Обновить позицию меню или переключить её стоп-лист
      description: menuGuard; cashier может менять только on для coffee, dispatch — только on для delivery; admin может редактировать все поля.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                on: { type: boolean }
                name: { type: string }
                section: { type: string, enum: [coffee, delivery] }
                price: { type: string }
                comp: { type: array, items: { type: object } }
                opts: { type: array, items: { type: object } }
      responses:
        '200': { description: Позиция обновлена }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Позиция не найдена }
    delete:
      tags: [Menu]
      summary: Удалить позицию меню
      description: Только adminGuard.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: Позиция удалена }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/menu/upload:
    post:
      tags: [Menu]
      summary: Загрузить изображение позиции меню
      description: Только adminGuard; принимает data URL и сохраняет responsive WebP варианты.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                id: { type: string }
                data: { type: string, description: Data URL изображения }
      responses:
        '200': { description: Возвращает ok и URL загруженного изображения }
        '400': { description: Некорректные данные изображения }
        '403': { $ref: '#/components/responses/Forbidden' }
        '500': { description: Ошибка сохранения изображения }

  /api/dmenu:
    get:
      tags: [Menu]
      summary: Меню доставки «Пятница»
      responses: { '200': { description: OK } }

  /api/delivery/info:
    get:
      tags: [Menu]
      summary: Конфиг доставки (часы, ETA, ссылки)
      responses: { '200': { description: OK } }

  /api/orders:
    post:
      tags: [Orders]
      summary: Создание заказа пользователя
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [brand, items, sum]
              properties:
                brand: { type: string, enum: [coffee, delivery] }
                items: { type: array, items: { type: object } }
                sum:   { type: number, minimum: 0 }
              additionalProperties: true
      responses: { '200': { description: OK } }
    get:
      tags: [Orders]
      summary: Очередь заказов диспетчера
      description: 'Доступ: dispatchGuard (cashier, dispatch, admin). Без status возвращает заказы за последние три дня; при status возвращает до 50 совпадений без ограничения по дате.'
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: status
          description: 'Допустимые статусы: new, accept, cook, way, done, cancel. При передаче status ограничение трёх дней не применяется.'
          schema: { type: string, enum: [new, accept, cook, way, done, cancel] }
        - in: query
          name: staff
          description: '1 — заказы сотрудников; 0 — заказы гостей; без параметра — все.'
          schema: { type: string, enum: ['0', '1'] }
        - in: query
          name: done
          description: '1 — скрывает выполненные обычные заказы; предзаказы остаются в очереди.'
          schema: { type: string, enum: ['0', '1'] }
      responses:
        '200': { description: Массив orders }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/orders/mine:
    get:
      tags: [Orders]
      summary: История заказов текущего пользователя
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/orders/{id}/status:
    post:
      tags: [Orders]
      summary: Изменить статус заказа
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [status], properties: { status: { type: string } } }
      responses:
        '200': { description: Статус изменён }
        '400': { description: Неизвестный статус }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Заказ не найден }
        '409': { description: Недопустимый переход статуса }

  /api/orders/{id}/delay:
    post:
      tags: [Orders]
      summary: Задержать один заказ
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                min: { type: integer, minimum: 0 }
                comment: { type: string, maxLength: 140 }
      responses:
        '200': { description: Задержка применена }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Заказ не найден }

  /api/orders/delay-all:
    post:
      tags: [Orders]
      summary: Массовая задержка активных заказов диспетчером
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [min]
              properties:
                min: { type: integer, minimum: 0 }
                comment: { type: string, maxLength: 140 }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/staff/stamp:
    post:
      tags: [Staff]
      summary: Начислить штамп клиенту
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [id], properties: { id: { type: string } } }
      responses:
        '200': { description: Результат операции }
        '404': { description: Гость не найден }

  /api/staff/redeem:
    post:
      tags: [Staff]
      summary: Списать бесплатный кофе
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [id], properties: { id: { type: string }, item: { type: string, maxLength: 40 } } }
      responses:
        '200': { description: Результат операции }
        '400': { description: Нет доступных подарков }

  /api/staff/scan:
    post:
      tags: [Staff]
      summary: Найти гостя по QR-коду
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string } } }
      responses:
        '200': { description: Возвращает customer }
        '404': { description: QR не найден }

  /api/chat/send:
    post:
      tags: [Chat]
      summary: Отправить сообщение в собственный чат
      description: Для клиентского треда требуется Bearer-токен владельца. Анонимный тред доступен только по capability-key формата anon- и 64 hex-символа с суффиксом :c или :d. Лимит — 15 сообщений за минуту на владельца и 120 в минуту на IP. Вызов сотрудника доступен обоим типам треда, но ограничен одним разом за 2 минуты на владельца/capability и 5 разами в минуту на IP.
      security:
        - {}
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key, text]
              properties:
                key:
                  type: string
                  maxLength: 80
                  description: customerId:c|d для профиля или anon- плюс 64 hex-символа и :c|:d для гостя
                text: { type: string, maxLength: 2000 }
                human: { type: boolean, description: Запросить сотрудника; доступно владельцу профиля или валидного анонимного capability-key }
                ctx: { type: string, enum: [coffee, delivery], description: Контекст берётся из суффикса ключа }
      responses:
        '200': { description: Сообщение сохранено }
        '400': { description: Некорректное сообщение или ID }
        '401': { description: Нет сессии владельца или валидного анонимного ключа }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { description: Превышен лимит отправки или cooldown вызова сотрудника }

  /api/chat/thread:
    get:
      tags: [Chat]
      summary: Получить сообщения собственного треда
      description: Для клиентского треда требуется Bearer-токен владельца. Анонимный тред читается только по capability-key формата anon- и 64 hex-символа с суффиксом :c или :d.
      security:
        - {}
        - BearerAuth: []
      parameters:
        - in: query
          name: key
          required: true
          schema: { type: string, maxLength: 80 }
        - in: query
          name: after
          schema: { type: integer, minimum: 0 }
      responses:
        '200': { description: Новые сообщения собственного треда }
        '400': { description: Некорректный ID последнего сообщения }
        '401': { description: Нет сессии владельца или валидного анонимного ключа }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/chat/list:
    get:
      tags: [Chat]
      summary: Список обращений сотрудника (chatGuard)
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: closed
          schema: { type: string, enum: ['0', '1'] }
      responses:
        '200': { description: Список тредов }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/chat/dialog:
    get:
      tags: [Chat]
      summary: Получить сообщения существующего треда сотрудником
      description: Кассир имеет доступ только к coffee-тредам, диспетчер — только к delivery-тредам; администратор может открыть оба контекста.
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: key
          required: true
          schema: { type: string, maxLength: 80 }
      responses:
        '200': { description: Массив msgs }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Тред не найден }

  /api/chat/reply:
    post:
      tags: [Chat]
      summary: Ответить гостю сотрудником
      description: Доступ ограничен существующим тредом и контекстом роли сотрудника.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [key, text], properties: { key: { type: string, maxLength: 80 }, text: { type: string, maxLength: 2000 } } }
      responses:
        '200': { description: 'Операция выполнена успешно (ok: true)' }
        '400': { description: Некорректное сообщение }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Тред не найден }

  /api/chat/close:
    post:
      tags: [Chat]
      summary: Закрыть диалог сотрудником
      description: Доступ ограничен существующим тредом и контекстом роли сотрудника.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [key], properties: { key: { type: string, maxLength: 80 } } }
      responses:
        '200': { description: 'Операция выполнена успешно (ok: true)' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Тред не найден }

  /api/chat/open:
    post:
      tags: [Chat]
      summary: Переоткрыть существующий тред (персонал)
      description: Доступ ограничен существующим тредом и контекстом роли сотрудника.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key: { type: string, maxLength: 80 }
      responses:
        '200': { description: OK }
        '400': { description: Некорректный ключ чата }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Тред не найден }

  /api/vapid:
    get:
      tags: [Push]
      summary: VAPID public key
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties: { publicKey: { type: string } }

  /api/push/subscribe:
    post:
      tags: [Push]
      summary: Подписка на web-push текущего пользователя
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sub]
              properties:
                sub: { type: object }
                dev: { type: string, maxLength: 64 }
      responses: { '200': { description: OK } }

  /api/promo/redeem:
    post:
      tags: [Promos]
      summary: Активация кофейного промокода гостем
      description: 'Принимает промокоды scope=coffee. Delivery-коды отклоняются с 400 и применяются в корзине доставки.'
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: Промокод применён
          content:
            application/json:
              schema:
                type: object
                properties:
                  msg:      { type: string }
                  customer: { $ref: '#/components/schemas/Customer' }
        '400': { description: Ошибка применения }

  /api/redeem:
    post:
      tags: [Promos]
      summary: Списать бесплатный кофе текущего пользователя
      description: 'Использует один доступный подарок текущего профиля; без подарков возвращает 400.'
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Подарок списан; возвращает обновлённый customer }
        '400': { description: Нет доступных подарков }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/promo/info:
    get:
      tags: [Promos]
      summary: Проверка delivery-промокода для корзины доставки
      description: 'Возвращает только активные промокоды scope=delivery; кофейные коды здесь не выдаются.'
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '404': { description: Промокод не найден }

  /api/promos:
    get:
      tags: [Admin]
      summary: Список промокодов
      security: [{ BearerAuth: [] }]
      responses: { '200': { description: OK } }
    post:
      tags: [Admin]
      summary: Создать промокод
      security: [{ BearerAuth: [] }]
      responses: { '200': { description: OK } }

  /api/stats:
    get:
      tags: [Admin]
      summary: Дашборд владельца
      security: [{ BearerAuth: [] }]
      responses: { '200': { description: OK } }

  /api/stats/redeems:
    get:
      tags: [Admin]
      summary: Списания бесплатных кофе за 30 дней (по видам)
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/auth/request-otp:
    post:
      tags: [Auth]
      summary: Запросить OTP в привязанный Telegram
      description: Публичный маршрут; номер должен принадлежать профилю с привязанным Telegram.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [phone], properties: { phone: { type: string } } }
      responses:
        '200': { description: 'Операция выполнена успешно (ok: true)' }
        '400': { description: Telegram не привязан }
        '404': { description: Профиль не найден }
        '429': { description: Слишком частый запрос }

  /api/auth/set-pin:
    post:
      tags: [Auth]
      summary: Изменить PIN авторизованного пользователя
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [pin], properties: { pin: { type: string, pattern: '^\\d{4}$' } } }
      responses:
        '200': { description: Возвращает customer }
        '400': { description: Некорректный PIN }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/auth/activate:
    post:
      tags: [Auth]
      summary: Активировать роль сотрудника кодом
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [code], properties: { code: { type: string } } }
      responses:
        '200': { description: Возвращает customer }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: Администратор не может понизить свою роль этим маршрутом }

  /api/auth/deactivate:
    post:
      tags: [Auth]
      summary: Отключить роль сотрудника
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Возвращает customer с ролью guest }
        '403': { description: Нельзя отключить последнего администратора }

  /api/exit:
    post:
      tags: [Auth]
      summary: Отозвать токен текущей сессии
      security: [{ BearerAuth: [] }]
      responses: { '200': { description: 'Операция выполнена успешно (ok: true)' } }

  /api/me/notify:
    put:
      tags: [Auth]
      summary: Сохранить предпочтения уведомлений
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tg: { type: boolean }
                web: { type: boolean }
              additionalProperties: true
      responses: { '200': { description: Возвращает customer } }

  /api/staff/activate-guest:
    post:
      tags: [Staff]
      summary: Активировать ожидающий профиль гостя
      description: Использует pendingGuard, а не обычный staffGuard.
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [id], properties: { id: { type: string } } }
      responses:
        '200': { description: 'Операция выполнена успешно (ok: true)' }
        '404': { description: Гость не найден }
        '409': { description: Уже активирован }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/staff/pending:
    get:
      tags: [Staff]
      summary: Список гостей, ожидающих активации
      description: Использует pendingGuard.
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Массив pending }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/staff/customers:
    get:
      tags: [Staff]
      summary: Найти гостей по имени или телефону
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: search
          schema: { type: string }
      responses: { '200': { description: Массив customers } }
    post:
      tags: [Staff]
      summary: Создать или активировать профиль гостя
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name, phone], properties: { name: { type: string }, phone: { type: string } } }
      responses: { '200': { description: Возвращает customer } }

  /api/staff/log:
    get:
      tags: [Staff]
      summary: Журнал операций кассы
      description: 'Доступ через staffGuard (cashier, admin). scope=coffee включает кофейные события; scope=delivery не реализован и не должен использоваться как фильтр.'
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: scope
          description: 'Единственное реализованное значение фильтра.'
          schema: { type: string, enum: [coffee] }
      responses: { '200': { description: Массив log } }

  /api/delivery/addr:
    get:
      tags: [Menu]
      summary: Подсказки улиц по населённому пункту
      parameters:
        - in: query
          name: place
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
      responses: { '200': { description: Массив suggestions } }

  /api/admin/weekpromo:
    put:
      tags: [Admin]
      summary: Обновить недельную акцию и пиццу месяца
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                text: { type: string }
                threshold: { type: number }
                gift: { type: string }
                until: { type: string }
                push: { type: boolean }
                pmName: { type: string }
                pmOn: { type: boolean }
      responses: { '200': { description: Акция обновлена } }

  /api/promos/{id}/toggle:
    post:
      tags: [Promos]
      summary: Переключить активность промокода
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses: { '200': { description: 'Операция выполнена успешно (ok: true)' } }

  /api/promos/{id}:
    delete:
      tags: [Promos]
      summary: Удалить промокод
      security: [{ BearerAuth: [] }]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses: { '200': { description: 'Операция выполнена успешно (ok: true)' } }

  /api/me/free-delivery:
    get:
      tags: [Promos]
      summary: Получить персональный код бесплатной доставки
      security: [{ BearerAuth: [] }]
      responses: { '200': { description: Возвращает code; значение может быть null } }

  /api/push/test:
    post:
      tags: [Push]
      summary: Отправить тестовое push текущему пользователю
      security: [{ BearerAuth: [] }]
      responses: { '200': { description: Результат отправки } }

  /api/push/fcm:
    post:
      tags: [Push]
      summary: Зарегистрировать FCM token текущего пользователя
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [token], properties: { token: { type: string } } }
      responses:
        '200': { description: 'Операция выполнена успешно (ok: true)' }
        '400': { description: Пустой token }

  /api/push/subs:
    get:
      tags: [Push]
      summary: Список push и Telegram подписок
      description: 'Только администратор (adminGuard, role=admin); для другой роли возвращается 403.'
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Объекты subs и tg }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/push/send:
    post:
      tags: [Push]
      summary: Разослать push и Telegram сообщение
      description: 'Только администратор (adminGuard, role=admin); для другой роли возвращается 403.'
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [body], properties: { body: { type: string } } }
      responses:
        '200': { description: Счётчики sent, delivered, failed и errors }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/push/send-hours-update:
    post:
      tags: [Push]
      summary: Уведомить клиентов об изменении графика доставки
      description: 'Только администратор (adminGuard, role=admin). Предпочитает Telegram при включённом notify_tg и не отправляет этому клиенту дублирующий Web Push/FCM.'
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: Счётчики recipients, telegramSent, pushSent и failed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/push/unsubscribe:
    post:
      tags: [Push]
      summary: Удалить push-подписки текущего пользователя
      security: [{ BearerAuth: [] }]
      responses: { '200': { description: 'Операция выполнена успешно (ok: true)' } }

  /api/push/del:
    post:
      tags: [Push]
      summary: Удалить Web Push-подписки указанного профиля
      description: 'Удаляет записи из таблицы subs по cid; не удаляет FCM token. Только администратор (adminGuard, role=admin), иначе 403.'
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [cid], properties: { cid: { type: string } } }
      responses:
        '200': { description: 'Операция выполнена успешно (ok: true)' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/stats/orders:
    get:
      tags: [Admin]
      summary: Статистика заказов для дашборда
      security: [{ BearerAuth: [] }]
      parameters:
        - in: query
          name: days
          schema: { type: integer, minimum: 1, maximum: 30, default: 14 }
      responses: { '200': { description: Статистика today, week и days } }

  /api/admin/bonuses:
    get:
      tags: [Admin]
      summary: Настройки бонусов (регистрация, регистрация по QR, установка приложения)
      description: "Для каждого вида отдельно: штампы в кофейне (0–10) и скидка ₽ в доставке (0–5000) по одноразовому промокоду. 0 — выключено."
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [Admin]
      summary: Сохранить настройки бонусов
      security: [{ BearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                days: { type: integer, minimum: 1, maximum: 365, description: "Срок промокода доставки" }
                kinds:
                  type: object
                  properties:
                    signup: { $ref: '#/components/schemas/BonusKind' }
                    qr: { $ref: '#/components/schemas/BonusKind' }
                    install: { $ref: '#/components/schemas/BonusKind' }
      responses:
        '200': { description: OK }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/bonus/install:
    post:
      tags: [Auth]
      summary: Начислить бонус за установку приложения (один раз на гостя)
      description: "Вызывается клиентом при событии appinstalled и при запуске установленного приложения. Повторные вызовы ничего не начисляют."
      security: [{ BearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  granted: { type: boolean }
                  code: { type: string, nullable: true, description: "Промокод доставки, если выдан" }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/tg/webhook:
    post:
      tags: [System]
      summary: Входящий webhook Telegram Bot API
      description: Проверяет заголовок x-telegram-bot-api-secret-token. При отсутствующем секрете возвращает 503; при неверном — 403. BearerAuth не используется.
      parameters:
        - in: header
          name: x-telegram-bot-api-secret-token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Telegram Update object; точная структура определяется Telegram Bot API.
              additionalProperties: true
      responses:
        '200': { description: Update принят в обработку }
        '403': { description: Неверный webhook secret }
        '503': { description: Webhook secret не настроен }

  /api/tg/diag:
    get:
      tags: [Admin]
      summary: Диагностика вебхука и соединения с Telegram Bot API (только админ)
      description: "Раньше был открыт без входа и показывал начало токена бота. Теперь доступен только администратору."
      security: [{ BearerAuth: [] }]
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }