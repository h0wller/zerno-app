version: 2

updates:
  - package-ecosystem: npm
    directory: /
    target-branch: pizza
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(npm)"

  - package-ecosystem: github-actions
    directory: /
    target-branch: pizza
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(actions)"
