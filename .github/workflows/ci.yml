name: CI Quality Gates

on:
  push:
    branches: [main, pizza]
  pull_request:
    branches: [main, pizza]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Code Quality & Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      # Dependabot can omit nested lockfile entries while leaving their
      # parent dependency ranges intact. Normalize the lockfile with the
      # same npm version before npm ci validates it.
      - name: Normalize dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      # Запускаем только статические проверки и линтеры (без браузера)
      - name: Run Static Audits & Linters
        run: npm run check && npm run pretest && npm run lint:code && npm run lint:dup && npm run lint:dead && npm run lint:layers

      # Контрактный смоук API (сервер поднимается в фоне скриптом)
      - name: Run Contract Smoke Tests
        run: npm run smoke

  e2e-tests:
    name: Playwright Regression Suite
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Normalize dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Build client bundle
        run: npm run build:client

      - name: Upload generated client assets
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: built-client-assets-${{ github.sha }}
          path: |
            public/dist/main.bundle.js
            public/dist/main.bundle.js.map

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Bonus Lifecycle E2E
        run: npx playwright test tests/bonus-lifecycle.spec.js --project=chromium

      # Keep the welcome/signup regression visible as an independent CI gate.
      - name: Run Bonus Signup Regression
        run: npx playwright test tests/bonus-signup.spec.js
        env:
          PORT: 3000
          ADMIN_CODE: '3364'
          CASHIER_CODE: '2468'
          DISPATCH_CODE: '5719'

      - name: Run Remaining Playwright Tests
        run: npx playwright test --grep-invert "Signup Bonuses Suite|Bonus Lifecycle Suite"
        env:
          PORT: 3000
          ADMIN_CODE: '3364'
          CASHIER_CODE: '2468'
          DISPATCH_CODE: '5719'

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
