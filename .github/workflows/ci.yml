name: CI Quality Gates

on:
  push:
    branches: [main, pizza]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Code Quality & Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Normalize dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Run Static Audits & Linters
        run: npm run check && npm run pretest && npm run lint:code && npm run lint:dup && npm run lint:dead && npm run lint:layers
      - name: Run Contract Smoke Tests
        run: npm run smoke

  web-push-node-compat:
    name: Web Push ESM compatibility / Node 22.11
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js 22.11
        uses: actions/setup-node@v7
        with:
          node-version: 22.11.0
      - name: Normalize dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Verify Web Push ESM integration on the supported Node 22 floor
        run: node --test tests/unit/seed-vapid.test.mjs tests/unit/push-web-push-import.test.mjs tests/unit/push-route-web-push-import.test.mjs

  e2e:
    name: E2E / ${{ matrix.group }}
    needs: quality-gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: Auth
            project: chromium
            specs: tests/registration.spec.js tests/auth-modal-ux.spec.js
            workers: 2
          - group: Bonuses
            project: chromium
            specs: tests/bonus-lifecycle.spec.js tests/bonus-signup.spec.js
            workers: 1
          - group: Staff API
            project: chromium
            specs: tests/staff-stops.spec.js tests/admin-reorder.spec.js
            workers: 1
          - group: Cart and checkout
            project: chromium
            specs: tests/cart-regress.spec.js tests/cart-checkout-clarity.spec.js tests/tma-cart-native-checkout-ux.spec.js tests/order-tracking-contact.spec.js tests/dispatcher-cancel-action.spec.js
            workers: 2
          - group: Menu and search
            project: chromium
            specs: tests/menu-cards.spec.js tests/menu-card-desktop-overflow.spec.js tests/menu-composition.spec.js tests/menu-nutrition.spec.js tests/delivery-search.spec.js tests/delivery-update-timestamp.spec.js tests/pizza-variant-selection.spec.js
            workers: 3
          - group: Profile
            project: chromium
            specs: tests/profile-orders.spec.js tests/swipe-panel-close.spec.js tests/address-book.spec.js
            workers: 2
          - group: Responsive UI
            project: chromium
            specs: tests/pour-accessibility.spec.js tests/tap-targets.spec.js tests/pwa-responsive.spec.js tests/staff-topbar-layout.spec.js tests/coffee-header-layout.spec.js tests/friday-info-responsive.spec.js tests/poster-hours.spec.js tests/menu-header-rail-layout.spec.js tests/coffee-profile-visual.spec.js tests/chat-support.spec.js tests/menu-image-fallback.spec.js tests/delivery-filter-scroll.spec.js tests/delivery-desktop-filter-layout.spec.js tests/mobile-support-entry.spec.js
            workers: 2
          - group: Visual stability
            project: chromium
            specs: tests/slow-network-layout.spec.js tests/splash-copy.spec.js tests/splash-owner.spec.js tests/splash-cls.spec.js
            workers: 1
          - group: UI baseline
            project: chromium
            specs: tests/ui-baseline.spec.js
            workers: 1
          - group: PWA
            project: chromium
            specs: tests/pwa-notifications.spec.js
            workers: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Normalize dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Build client bundle
        run: npm run build:client
      - name: Verify staff layout code is present in the production bundle
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const bundle = readFileSync('public/dist/main.bundle.js', 'utf8');
          for (const marker of ['zt_role', 'data-staff-role', 'data-staff-ready']) {
            if (!bundle.includes(marker)) throw new Error('Production bundle is missing ' + marker);
          }
          NODE
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run isolated regression group
        run: npx playwright test ${{ matrix.specs }} --project="${{ matrix.project }}" --workers=${{ matrix.workers }}
        env:
          PORT: 3000
          ADMIN_CODE: '3364'
          CASHIER_CODE: '2468'
          DISPATCH_CODE: '5719'
      - name: Upload group diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.group }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            artifacts/visual-audit/
          if-no-files-found: ignore
          retention-days: 7

  visual-audit-capture:
    name: E2E / Visual UX capture
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Normalize dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Build client bundle
        run: npm run build:client
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Capture deterministic visual audit screens
        run: npx playwright test tests/visual-audit.spec.js --project=chromium --workers=1
        env:
          PORT: 3000
      - name: Upload visual audit screens
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-ux-baseline-test-${{ github.run_id }}
          path: artifacts/visual-audit/
          retention-days: 30

  e2e-mobile:
    name: E2E / Mobile Chrome responsive
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Normalize dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Build client bundle
        run: npm run build:client
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run focused mobile viewport regressions
        run: >-
          npx playwright test
          tests/auth-modal-ux.spec.js
          tests/cart-regress.spec.js
          tests/pwa-responsive.spec.js
          tests/coffee-header-layout.spec.js
          tests/menu-header-rail-layout.spec.js
          tests/swipe-panel-close.spec.js
          tests/slow-network-layout.spec.js
          --project="Mobile Chrome"
          --workers=1
        env:
          PORT: 3000
          ADMIN_CODE: '3364'
          CASHIER_CODE: '2468'
          DISPATCH_CODE: '5719'
      - name: Upload mobile diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-Mobile-Chrome-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
