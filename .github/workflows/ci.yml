name: CI Quality Gates

on:
  push:
    branches: [main, pizza]
  pull_request:
    branches: [main, pizza]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Code Quality & Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      # Dependabot can omit nested lockfile entries while leaving their
      # parent dependency ranges intact. Normalize the lockfile with the
      # same npm version before npm ci validates it.
      - name: Normalize dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      # Запускаем только статические проверки и линтеры (без браузера)
      - name: Run Static Audits & Linters
        run: npm run check && npm run pretest && npm run lint:code && npm run lint:dup && npm run lint:dead && npm run lint:layers

      # Контрактный смоук API (сервер поднимается в фоне скриптом)
      - name: Run Contract Smoke Tests
        run: npm run smoke

  e2e-tests:
    name: Playwright Regression Suite
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Normalize dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install dependencies
        run: npm ci

      - name: Build client bundle
        id: build-client
        run: npm run build:client

      - name: Verify staff layout code is present in the production bundle
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const bundle = readFileSync('public/dist/main.bundle.js', 'utf8');
          for (const marker of ['zt_role', 'data-staff-role', 'data-staff-ready']) {
            if (!bundle.includes(marker)) throw new Error('Production bundle is missing ' + marker);
          }
          NODE

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Bonus Lifecycle E2E
        run: npx playwright test tests/bonus-lifecycle.spec.js --project=chromium

      # Keep the welcome/signup regression visible as an independent CI gate.
      - name: Run Bonus Signup Regression
        run: npx playwright test tests/bonus-signup.spec.js
        env:
          PORT: 3000
          ADMIN_CODE: '3364'
          CASHIER_CODE: '2468'
          DISPATCH_CODE: '5719'

      - name: Run Remaining Playwright Tests
        run: npx playwright test --grep-invert "Signup Bonuses Suite|Bonus Lifecycle Suite"
        env:
          PORT: 3000
          ADMIN_CODE: '3364'
          CASHIER_CODE: '2468'
          DISPATCH_CODE: '5719'

      - name: Upload built client output
        if: always() && steps.build-client.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: built-client-output
          path: |
            public/dist/main.bundle.js
            public/sw.js
            public/index.html
          retention-days: 7

      # Keep responsive layout screenshots available for visual review on green and red runs.
      - name: Upload Playwright Diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  sync-built-client:
    name: Sync production client output
    needs: e2e-tests
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 92 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout PR source branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Download tested client output
        uses: actions/download-artifact@v7
        with:
          name: built-client-output
          path: .built-client-output

      - name: Replace tracked production assets
        run: |
          set -euo pipefail
          test -s .built-client-output/dist/main.bundle.js
          test -s .built-client-output/sw.js
          test -s .built-client-output/index.html
          install -D .built-client-output/dist/main.bundle.js public/dist/main.bundle.js
          install -D .built-client-output/sw.js public/sw.js
          install -D .built-client-output/index.html public/index.html

      - name: Commit tested production assets
        env:
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/dist/main.bundle.js public/sw.js public/index.html
          if git diff --cached --quiet; then
            echo "Production assets already match the tested build."
          else
            git commit -m "build(pr92): sync tested production client assets"
            git push origin "HEAD:${PR_BRANCH}"
          fi
