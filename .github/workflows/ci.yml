name: CI Quality Gates

on:
  push:
    branches: [main, pizza]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Code Quality & Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Normalize dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Run Static Audits & Linters
        run: npm run check && npm run pretest && npm run lint:code && npm run lint:dup && npm run lint:dead && npm run lint:layers
      - name: Run Contract Smoke Tests
        run: npm run smoke

  e2e:
    name: E2E / ${{ matrix.group }}
    needs: quality-gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: Auth
            project: chromium
            specs: tests/registration.spec.js tests/auth-modal-ux.spec.js
            workers: 2
          - group: Bonuses
            project: chromium
            specs: tests/bonus-lifecycle.spec.js tests/bonus-signup.spec.js
            workers: 1
          - group: Staff API
            project: chromium
            specs: tests/staff-stops.spec.js tests/admin-reorder.spec.js
            workers: 1
          - group: Cart and checkout
            project: chromium
            specs: tests/cart-regress.spec.js tests/cart-checkout-clarity.spec.js tests/tma-cart-native-checkout-ux.spec.js tests/order-tracking-contact.spec.js tests/delivery-card-cart-state.spec.js tests/dispatcher-cancel-action.spec.js tests/cart-motion-system.spec.js tests/delivery-brand-active-states.spec.js
            workers: 2
          - group: Menu and search
            project: chromium
            specs: tests/menu-cards.spec.js tests/mobile-lcp.spec.js tests/delivery-card-stable-meta.spec.js tests/menu-card-desktop-overflow.spec.js tests/menu-composition.spec.js tests/menu-nutrition.spec.js tests/delivery-search.spec.js tests/delivery-update-timestamp.spec.js tests/pizza-variant-selection.spec.js
            workers: 3
          - group: Profile
            project: chromium
            specs: tests/profile-orders.spec.js tests/swipe-panel-close.spec.js tests/address-book.spec.js
            workers: 2
          - group: Responsive UI
            project: chromium
            specs: tests/pour-accessibility.spec.js tests/pwa-responsive.spec.js tests/staff-topbar-layout.spec.js tests/coffee-header-layout.spec.js tests/friday-info-responsive.spec.js tests/poster-hours.spec.js tests/menu-header-rail-layout.spec.js tests/mobile-bottom-category-rail.spec.js tests/mobile-rail-sticky-visible.spec.js tests/ticker-motion-accessibility.spec.js tests/category-rail-scroll-behavior.spec.js tests/coffee-profile-visual.spec.js tests/chat-support.spec.js tests/menu-image-fallback.spec.js tests/delivery-filter-scroll.spec.js tests/delivery-desktop-filter-layout.spec.js tests/mobile-support-entry.spec.js tests/toast-motion.spec.js
            workers: 2
          - group: Visual stability
            project: chromium
            specs: tests/slow-network-layout.spec.js tests/splash-copy.spec.js tests/splash-owner.spec.js tests/splash-cls.spec.js
            workers: 1
          - group: UI baseline
            project: chromium
            specs: tests/ui-baseline.spec.js
            workers: 1
          - group: PWA
            project: chromium
            specs: tests/pwa-notifications.spec.js
            workers: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Normalize dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Build client bundle
        run: npm run build:client
      - name: Verify staff layout code is present in the production bundle
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const bundle = readFileSync('public/dist/main.bundle.js', 'utf8');
          for (const marker of ['zt_role', 'data-staff-role', 'data-staff-ready']) {
            if (!bundle.includes(marker)) throw new Error('Production bundle is missing ' + marker);
          }
          NODE
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Set deterministic bonus test clock
        if: matrix.group == 'Bonuses'
        run: |
          echo "ZERNO_TEST_NOW=$(TZ=Europe/Kaliningrad date +'%Y-%m-%dT16:00:00%:z')" >> "$GITHUB_ENV"
      - name: Run isolated regression group
        run: npx playwright test ${{ matrix.specs }} --project="${{ matrix.project }}" --workers=${{ matrix.workers }}
        env:
          PORT: 3000
          ADMIN_CODE: '3364'
          CASHIER_CODE: '2468'
          DISPATCH_CODE: '5719'
      - name: Upload group diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.group }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            artifacts/visual-audit/
          if-no-files-found: ignore
          retention-days: 7

  visual-audit-capture:
    name: E2E / Visual UX capture
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Normalize dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Build client bundle
        run: npm run build:client
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Capture deterministic visual audit screens
        run: npx playwright test tests/visual-audit.spec.js --project=chromium --workers=1
        env:
          PORT: 3000
      - name: Upload visual audit screens
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-ux-baseline-test-${{ github.run_id }}
          path: artifacts/visual-audit/
          retention-days: 30

  e2e-mobile:
    name: E2E / Mobile Chrome responsive
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Normalize dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Build client bundle
        run: npm run build:client
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run focused mobile viewport regressions
        run: >-
          npx playwright test
          tests/auth-modal-ux.spec.js
          tests/cart-regress.spec.js
          tests/cart-motion-system.spec.js
          tests/pwa-responsive.spec.js
          tests/coffee-header-layout.spec.js
          tests/menu-header-rail-layout.spec.js
          tests/mobile-bottom-category-rail.spec.js
          tests/mobile-rail-sticky-visible.spec.js
          tests/category-rail-scroll-behavior.spec.js
          tests/swipe-panel-close.spec.js
          tests/slow-network-layout.spec.js
          tests/tap-targets.spec.js
          --project="Mobile Chrome"
          --workers=1
        env:
          PORT: 3000
          ADMIN_CODE: '3364'
          CASHIER_CODE: '2468'
          DISPATCH_CODE: '5719'
      - name: Upload mobile diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-Mobile-Chrome-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  lighthouse-mobile:
    name: Lighthouse / Mobile LCP comparison
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 300
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Install pinned Lighthouse
        run: npx --yes lighthouse@13.5.0 --version
      - name: Build PR client bundle
        run: npm run build:client
      - name: Prepare merge-base build
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          BASE_SHA="$(git merge-base "$PR_BASE_SHA" "$PR_HEAD_SHA")"
          echo "LCP_BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          git worktree add --detach "$RUNNER_TEMP/zerno-lcp-base" "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/zerno-lcp-base/node_modules"
          (cd "$RUNNER_TEMP/zerno-lcp-base" && npm run build:client)
      - name: Run matched mobile Lighthouse audits
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          REPORT_DIR="$RUNNER_TEMP/lighthouse-reports"
          mkdir -p "$REPORT_DIR"
          CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -type f -name chrome | head -n 1)"
          test -n "$CHROME_PATH" && test -x "$CHROME_PATH"
          echo "Chrome: $CHROME_PATH"
          echo "Baseline: $LCP_BASE_SHA"
          echo "PR head: $PR_HEAD_SHA"

          run_variant() {
            local project_dir="$1"
            local label="$2"
            local port="$3"
            local db_path="$RUNNER_TEMP/lcp-$label.sqlite"
            local server_log="$RUNNER_TEMP/lcp-$label-server.log"
            local server_pid=""

            (
              cd "$project_dir"
              NODE_ENV=test DB_PATH="$db_path" PUBLIC_DIR="$project_dir/public" PORT="$port" \
                ADMIN_CODE='ci-lighthouse-admin-role-code' \
                CASHIER_CODE='ci-lighthouse-cashier-code' \
                DISPATCH_CODE='ci-lighthouse-dispatch-code' \
                TELEGRAM_BOT_TOKEN='' TG_WEBHOOK_SECRET='' SMS_AUTH_ENABLED=false \
                node server.js
            ) >"$server_log" 2>&1 &
            server_pid=$!

            cleanup_server() {
              if kill -0 "$server_pid" 2>/dev/null; then
                kill "$server_pid" || true
                wait "$server_pid" || true
              fi
            }
            trap cleanup_server RETURN

            ready=0
            for attempt in $(seq 1 80); do
              if curl -fsS "http://127.0.0.1:$port/api/health" >/dev/null; then
                ready=1
                break
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                cat "$server_log"
                return 1
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              cat "$server_log"
              echo "Server did not become ready: $label" >&2
              return 1
            fi

            DB_PATH="$db_path" PUBLIC_DIR="$project_dir/public" \
              node "$GITHUB_WORKSPACE/scripts/lighthouse-fixture.mjs"
            curl -fsS "http://127.0.0.1:$port/api/menu" > "$REPORT_DIR/$label-coffee-menu.json"
            curl -fsS "http://127.0.0.1:$port/api/dmenu" > "$REPORT_DIR/$label-delivery-menu.json"

            for brand in coffee delivery; do
              for sample in 1 2; do
                echo "Lighthouse $label / $brand / sample $sample"
                npx --yes lighthouse@13.5.0 \
                  "http://127.0.0.1:$port/?brand=$brand&lighthouse=1" \
                  --chrome-path="$CHROME_PATH" \
                  --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
                  --form-factor=mobile \
                  --throttling-method=simulate \
                  --throttling.rttMs=150 \
                  --throttling.throughputKbps=1638.4 \
                  --throttling.cpuSlowdownMultiplier=4 \
                  --screenEmulation.mobile=true \
                  --screenEmulation.width=360 \
                  --screenEmulation.height=800 \
                  --screenEmulation.deviceScaleFactor=1.75 \
                  --only-categories=performance \
                  --max-wait-for-load=45000 \
                  --output=json \
                  --output-path="$REPORT_DIR/$label-$brand-$sample.json" \
                  --quiet
              done
            done

            cleanup_server
            trap - RETURN
          }

          run_variant "$RUNNER_TEMP/zerno-lcp-base" "base" 3210
          run_variant "$GITHUB_WORKSPACE" "head" 3211

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const directory = process.env.REPORT_DIR || path.join(process.env.RUNNER_TEMP, 'lighthouse-reports');
          const files = fs.readdirSync(directory).filter(name => name.endsWith('.json') && /^(base|head)-(coffee|delivery)-[12]\.json$/.test(name));
          const records = files.map(name => {
            const report = JSON.parse(fs.readFileSync(path.join(directory, name), 'utf8'));
            const audits = report.audits || {};
            const lcpElement = audits['largest-contentful-paint-element']?.details?.items?.[0];
            const node = lcpElement?.node || lcpElement?.items?.[0]?.node || null;
            const value = id => audits[id]?.numericValue ?? null;
            return {
              sample: name,
              version: name.split('-')[0],
              brand: name.split('-')[1],
              score: report.categories?.performance?.score ?? null,
              lcp: value('largest-contentful-paint'),
              cls: value('cumulative-layout-shift'),
              tbt: value('total-blocking-time'),
              speedIndex: value('speed-index'),
              fcp: value('first-contentful-paint'),
              lcpSelector: node?.selector || null,
              lcpSnippet: node?.snippet || null,
              lcpDiscovery: audits['lcp-discovery-insight']?.displayValue || null
            };
          });
          const median = values => {
            const sorted = values.filter(Number.isFinite).sort((a, b) => a - b);
            if (!sorted.length) return null;
            return sorted.length % 2 ? sorted[(sorted.length - 1) / 2] : (sorted[sorted.length / 2 - 1] + sorted[sorted.length / 2]) / 2;
          };
          const summary = [];
          for (const version of ['base', 'head']) {
            for (const brand of ['coffee', 'delivery']) {
              const rows = records.filter(row => row.version === version && row.brand === brand);
              const aggregate = key => median(rows.map(row => row[key]));
              summary.push({
                version, brand, runs: rows.length,
                performanceScore: median(rows.map(row => row.score)),
                lcpMs: aggregate('lcp'),
                cls: aggregate('cls'),
                tbtMs: aggregate('tbt'),
                speedIndexMs: aggregate('speedIndex'),
                fcpMs: aggregate('fcp'),
                lcpElements: [...new Set(rows.map(row => row.lcpSelector || row.lcpSnippet).filter(Boolean))]
              });
            }
          }
          fs.writeFileSync(path.join(directory, 'summary.json'), JSON.stringify({ baselineSha: process.env.LCP_BASE_SHA, headSha: process.env.PR_HEAD_SHA, records, summary }, null, 2));
          console.log(JSON.stringify({ baselineSha: process.env.LCP_BASE_SHA, headSha: process.env.PR_HEAD_SHA, summary }, null, 2));
          NODE
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-mobile-lcp-${{ github.run_id }}
          path: ${{ runner.temp }}/lighthouse-reports/
          if-no-files-found: error
          retention-days: 30
