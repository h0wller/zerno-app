name: CI Quality Gates

on:
  push:
    branches: [main, pizza]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Code Quality & Guardrails
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Normalize dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Run Static Audits & Linters
        run: npm run check && npm run pretest && npm run lint:code && npm run lint:dup && npm run lint:dead && npm run lint:layers
      - name: Run Contract Smoke Tests
        run: npm run smoke

  e2e:
    name: E2E / ${{ matrix.group }}
    needs: quality-gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: Auth
            project: chromium
            specs: tests/registration.spec.js tests/auth-modal-ux.spec.js
            workers: 2
          - group: Bonuses
            project: chromium
            specs: tests/bonus-lifecycle.spec.js tests/bonus-signup.spec.js
            workers: 1
          - group: Staff API
            project: chromium
            specs: tests/staff-stops.spec.js tests/admin-reorder.spec.js
            workers: 1
          - group: Cart and checkout
            project: chromium
            specs: tests/cart-regress.spec.js tests/cart-checkout-clarity.spec.js tests/tma-cart-native-checkout-ux.spec.js tests/order-tracking-contact.spec.js tests/delivery-card-cart-state.spec.js tests/dispatcher-cancel-action.spec.js tests/cart-motion-system.spec.js tests/delivery-brand-active-states.spec.js
            workers: 2
          - group: Menu and search
            project: chromium
            specs: tests/menu-cards.spec.js tests/mobile-lcp.spec.js tests/delivery-card-stable-meta.spec.js tests/menu-card-desktop-overflow.spec.js tests/menu-composition.spec.js tests/menu-nutrition.spec.js tests/delivery-search.spec.js tests/delivery-update-timestamp.spec.js tests/pizza-variant-selection.spec.js
            workers: 3
          - group: Profile
            project: chromium
            specs: tests/profile-orders.spec.js tests/swipe-panel-close.spec.js tests/address-book.spec.js
            workers: 2
          - group: Responsive UI
            project: chromium
            specs: tests/pour-accessibility.spec.js tests/pwa-responsive.spec.js tests/staff-topbar-layout.spec.js tests/coffee-header-layout.spec.js tests/friday-info-responsive.spec.js tests/poster-hours.spec.js tests/menu-header-rail-layout.spec.js tests/mobile-bottom-category-rail.spec.js tests/mobile-rail-sticky-visible.spec.js tests/ticker-motion-accessibility.spec.js tests/category-rail-scroll-behavior.spec.js tests/coffee-profile-visual.spec.js tests/chat-support.spec.js tests/menu-image-fallback.spec.js tests/delivery-filter-scroll.spec.js tests/delivery-desktop-filter-layout.spec.js tests/mobile-support-entry.spec.js tests/toast-motion.spec.js
            workers: 2
          - group: Visual stability
            project: chromium
            specs: tests/slow-network-layout.spec.js tests/splash-copy.spec.js tests/splash-owner.spec.js tests/splash-cls.spec.js
            workers: 1
          - group: UI baseline
            project: chromium
            specs: tests/ui-baseline.spec.js
            workers: 1
          - group: PWA
            project: chromium
            specs: tests/pwa-notifications.spec.js
            workers: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Normalize dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Build client bundle
        run: npm run build:client
      - name: Verify staff layout code is present in the production bundle
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const bundle = readFileSync('public/dist/main.bundle.js', 'utf8');
          for (const marker of ['zt_role', 'data-staff-role', 'data-staff-ready']) {
            if (!bundle.includes(marker)) throw new Error('Production bundle is missing ' + marker);
          }
          NODE
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Set deterministic bonus test clock
        if: matrix.group == 'Bonuses'
        run: |
          echo "ZERNO_TEST_NOW=$(TZ=Europe/Kaliningrad date +'%Y-%m-%dT16:00:00%:z')" >> "$GITHUB_ENV"
      - name: Run isolated regression group
        run: npx playwright test ${{ matrix.specs }} --project="${{ matrix.project }}" --workers=${{ matrix.workers }}
        env:
          PORT: 3000
          ADMIN_CODE: '3364'
          CASHIER_CODE: '2468'
          DISPATCH_CODE: '5719'
      - name: Upload group diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-${{ matrix.group }}-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
            artifacts/visual-audit/
          if-no-files-found: ignore
          retention-days: 7

  visual-audit-capture:
    name: E2E / Visual UX capture
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Normalize dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Build client bundle
        run: npm run build:client
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Capture deterministic visual audit screens
        run: npx playwright test tests/visual-audit.spec.js --project=chromium --workers=1
        env:
          PORT: 3000
      - name: Upload visual audit screens
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-ux-baseline-test-${{ github.run_id }}
          path: artifacts/visual-audit/
          retention-days: 30

  e2e-mobile:
    name: E2E / Mobile Chrome responsive
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Normalize dependency lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Install dependencies
        run: npm ci
      - name: Build client bundle
        run: npm run build:client
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run focused mobile viewport regressions
        run: >-
          npx playwright test
          tests/auth-modal-ux.spec.js
          tests/cart-regress.spec.js
          tests/cart-motion-system.spec.js
          tests/pwa-responsive.spec.js
          tests/coffee-header-layout.spec.js
          tests/menu-header-rail-layout.spec.js
          tests/mobile-bottom-category-rail.spec.js
          tests/mobile-rail-sticky-visible.spec.js
          tests/category-rail-scroll-behavior.spec.js
          tests/swipe-panel-close.spec.js
          tests/slow-network-layout.spec.js
          tests/tap-targets.spec.js
          --project="Mobile Chrome"
          --workers=1
        env:
          PORT: 3000
          ADMIN_CODE: '3364'
          CASHIER_CODE: '2468'
          DISPATCH_CODE: '5719'
      - name: Upload mobile diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-Mobile-Chrome-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  splash-series:
    name: Splash series / A F C7 + C1 diagnostics
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 300
    needs: quality-gates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout benchmark tooling and pinned history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Install shared dependencies
        run: npm ci
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Lint splash benchmark script
        run: npx eslint scripts/splash-series.mjs --max-warnings 50
      - name: Run independent pinned splash series
        run: |
          set -euo pipefail
          BASE_SHA="$(node -p "JSON.parse(require('node:fs').readFileSync('scripts/lighthouse-variants.json','utf8')).baseSha")"
          HEAD_SHA="$(node -p "JSON.parse(require('node:fs').readFileSync('scripts/lighthouse-variants.json','utf8')).headSha")"
          REPORT_DIR="$RUNNER_TEMP/splash"
          mkdir -p "$REPORT_DIR"
          run_variant() {
            local variant="$1"
            local port="$2"
            local project_dir="$RUNNER_TEMP/zerno-splash-$variant"
            local db_path="$RUNNER_TEMP/splash-$variant.sqlite"
            local server_log="$RUNNER_TEMP/splash-$variant-server.log"
            if [ "$variant" = F ]; then
              git worktree add --detach "$project_dir" "$BASE_SHA"
            else
              git worktree add --detach "$project_dir" "$HEAD_SHA"
            fi
            ln -s "$GITHUB_WORKSPACE/node_modules" "$project_dir/node_modules"
            node scripts/prepare-lighthouse-variant.mjs "$variant" "$project_dir" "$REPORT_DIR"
            (cd "$project_dir" && npm run build:client)
            (cd "$project_dir" && NODE_ENV=test DB_PATH="$db_path" PUBLIC_DIR="$project_dir/public" PORT="$port" ADMIN_CODE='ci-lighthouse-admin-role-code' CASHIER_CODE='ci-lighthouse-cashier-role-code' DISPATCH_CODE='ci-lighthouse-dispatch-code' TELEGRAM_BOT_TOKEN='' TG_WEBHOOK_SECRET='' SMS_AUTH_ENABLED=false node server.js) >"$server_log" 2>&1 &
            local server_pid=$!
            cleanup_server() {
              if kill -0 "$server_pid" 2>/dev/null; then
                kill "$server_pid" || true
                wait "$server_pid" || true
              fi
            }
            trap cleanup_server RETURN
            local ready=0
            for attempt in $(seq 1 80); do
              if curl -fsS "http://127.0.0.1:$port/api/health" >/dev/null; then
                ready=1
                break
              fi
              if ! kill -0 "$server_pid" 2>/dev/null; then
                cat "$server_log"
                return 1
              fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              cat "$server_log"
              echo "Server did not become ready for $variant" >&2
              return 1
            fi
            DB_PATH="$db_path" PUBLIC_DIR="$project_dir/public" node "$GITHUB_WORKSPACE/scripts/lighthouse-fixture.mjs"
            local -a series_args=(--delays=0,3000)
            if [ "$variant" = C1 ]; then series_args=(--delays=0 --brands=delivery); fi
            node scripts/splash-series.mjs --url="http://127.0.0.1:$port" --label="$variant" --runs=5 "${series_args[@]}" --out="$REPORT_DIR"
            cleanup_server
            trap - RETURN
          }
          run_variant A 3211
          run_variant F 3212
          run_variant C7 3213
          run_variant C1 3214
      - name: Upload splash series results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: splash-series-${{ github.run_id }}
          path: ${{ runner.temp }}/splash/
          if-no-files-found: error
          retention-days: 30

  lighthouse-variant-config:
    name: Lighthouse / Load pinned variant matrix
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 300
    needs: quality-gates
    runs-on: ubuntu-latest
    outputs:
      variants: ${{ steps.config.outputs.variants }}
      runs: ${{ steps.config.outputs.runs }}
      devtools_variants: ${{ steps.config.outputs.devtools_variants }}
      base_sha: ${{ steps.config.outputs.base_sha }}
      head_sha: ${{ steps.config.outputs.head_sha }}
    steps:
      - name: Checkout benchmark definitions
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: config
        name: Read pinned benchmark configuration
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const c=JSON.parse(fs.readFileSync('scripts/lighthouse-variants.json','utf8'));
          if(c.runs!==5) throw Error('scripts/lighthouse-variants.json: runs must equal 5');
          if(!/^[a-f0-9]{40}$/.test(c.baseSha)||!/^[a-f0-9]{40}$/.test(c.headSha)) throw Error('baseSha/headSha must be pinned 40-character SHAs');
          if(JSON.stringify(c.variants)!==JSON.stringify(['A','B','C1','C2','C3','C4','C5','D','E','F'])) throw Error('Expected variants A-F plus C1-C5 in declared order');
          if(JSON.stringify(c.devtoolsVariants)!==JSON.stringify(['A','F','C1','C2','C3','C4','C5'])) throw Error('Expected DevTools for A, F and C1-C5');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'variants='+JSON.stringify(c.variants)+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'runs='+c.runs+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'devtools_variants='+c.devtoolsVariants.join(' ')+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'base_sha='+c.baseSha+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'head_sha='+c.headSha+'\n');
          NODE
          git cat-file -e "$(node -p 'JSON.parse(require("fs").readFileSync("scripts/lighthouse-variants.json")).baseSha')^{commit}"
          git cat-file -e "$(node -p 'JSON.parse(require("fs").readFileSync("scripts/lighthouse-variants.json")).headSha')^{commit}"
          node --check scripts/prepare-lighthouse-variant.mjs
          node --check scripts/lighthouse-variant-summary.mjs
          bash -n scripts/run-lighthouse-variant.sh

  lighthouse-mobile:
    name: Lighthouse / Variant ${{ matrix.variant }}
    needs: lighthouse-variant-config
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.lighthouse-variant-config.outputs.variants) }}
    steps:
      - name: Checkout benchmark tooling and pinned history
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
      - name: Install shared dependencies
        run: npm ci
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Install pinned Lighthouse
        run: npx --yes lighthouse@13.5.0 --version
      - name: Create isolated pinned variant worktree
        env:
          VARIANT: ${{ matrix.variant }}
          BASE_SHA: ${{ needs.lighthouse-variant-config.outputs.base_sha }}
          HEAD_SHA: ${{ needs.lighthouse-variant-config.outputs.head_sha }}
          RUNS: ${{ needs.lighthouse-variant-config.outputs.runs }}
          DEVTOOLS_VARIANTS: ${{ needs.lighthouse-variant-config.outputs.devtools_variants }}
          DEVTOOLS_RUNS: 5
        run: |
          set -euo pipefail
          REPORT_DIR="$RUNNER_TEMP/lighthouse-reports"
          PROJECT_DIR="$RUNNER_TEMP/zerno-lcp-$VARIANT"
          mkdir -p "$REPORT_DIR"
          if [ "$VARIANT" = F ]; then
            git worktree add --detach "$PROJECT_DIR" "$BASE_SHA"
          else
            git worktree add --detach "$PROJECT_DIR" "$HEAD_SHA"
          fi
          ln -s "$GITHUB_WORKSPACE/node_modules" "$PROJECT_DIR/node_modules"
          node scripts/prepare-lighthouse-variant.mjs "$VARIANT" "$PROJECT_DIR" "$REPORT_DIR"
          (cd "$PROJECT_DIR" && npm run build:client)
          if [ "$VARIANT" = B ]; then
            set +e
            (cd "$PROJECT_DIR" && PORT=3000 ADMIN_CODE='3364' CASHIER_CODE='2468' DISPATCH_CODE='5719' npx playwright test tests/mobile-lcp.spec.js --project=chromium --workers=1) > "$REPORT_DIR/B-mobile-lcp-playwright.log" 2>&1
            TEST_STATUS=$?
            set -e
            cat "$REPORT_DIR/B-mobile-lcp-playwright.log"
            if [ "$TEST_STATUS" -eq 0 ]; then
              TEST_RESULT=passed
            elif grep -Eq 'Expected: 1|Received: 2' "$REPORT_DIR/B-mobile-lcp-playwright.log"; then
              TEST_RESULT=duplicate-render
              echo "Variant B has a duplicate initial coffee render; keeping the benchmark result with this explicit caveat."
            else
              exit "$TEST_STATUS"
            fi
            node -e 'const fs=require("node:fs"); const file=process.argv[1], status=process.argv[2]; const manifest=JSON.parse(fs.readFileSync(file,"utf8")); manifest.coffeeInitialRenderTest={status,assertion:"window.__coffeeGridWrites === 1"}; fs.writeFileSync(file,JSON.stringify(manifest,null,2));' "$REPORT_DIR/manifest-B.json" "$TEST_RESULT"
          fi
          echo "LCP_VARIANT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "LCP_REPORT_DIR=$REPORT_DIR" >> "$GITHUB_ENV"
      - name: Run matched Lighthouse audits
        env:
          VARIANT: ${{ matrix.variant }}
          RUNS: ${{ needs.lighthouse-variant-config.outputs.runs }}
          DEVTOOLS_VARIANTS: ${{ needs.lighthouse-variant-config.outputs.devtools_variants }}
          DEVTOOLS_RUNS: 5
        run: bash scripts/run-lighthouse-variant.sh "$LCP_VARIANT_DIR" "$VARIANT" "$RUNS" "$LCP_REPORT_DIR" 3210
      - name: Upload variant reports, traces and manifest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-variant-${{ matrix.variant }}-${{ github.run_id }}
          path: ${{ runner.temp }}/lighthouse-reports/
          if-no-files-found: error
          retention-days: 30

  lighthouse-aggregate:
    name: Lighthouse / Aggregate variant matrix
    if: always() && needs.lighthouse-variant-config.result == 'success'
    needs: [lighthouse-variant-config, lighthouse-mobile]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout benchmark scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Download all variant reports and DevTools traces
        uses: actions/download-artifact@v7
        with:
          pattern: lighthouse-variant-*-${{ github.run_id }}
          path: lighthouse-reports
          merge-multiple: true
      - name: Build combined JSON and Markdown summary
        run: node scripts/lighthouse-variant-summary.mjs lighthouse-reports
      - name: Upload combined benchmark report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-mobile-variant-matrix-${{ github.run_id }}
          path: lighthouse-reports/
          if-no-files-found: error
          retention-days: 30
