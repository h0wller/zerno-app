name: Deploy to Timeweb
on:
  workflow_run:
    workflows: ["CI"]
    branches: [pizza]
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script_stop: true 
          script: |
            cd /var/www/app
            git fetch origin
            git reset --hard ${{ github.event_name == 'workflow_dispatch' && 'origin/pizza' || github.event.workflow_run.head_sha }}
            npm ci --omit=dev
            pm2 reload zerno-app
            pm2 status zerno-app