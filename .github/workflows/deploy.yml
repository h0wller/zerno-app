name: Deploy to Timeweb
on:
  workflow_run:
    workflows: ["CI"]
    branches: [pizza]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Проверяем, что CI именно успешен
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          # Важно: останавливаем скрипт при любой ошибке
          script_stop: true 
          script: |
            cd /var/www/app
            # Жестко переходим на коммит, который прошел CI
            git fetch origin
            git reset --hard ${{ github.event.workflow_run.head_sha }}
            npm ci --omit=dev
            # Исправленная команда PM2 (без name: CI)
            pm2 reload zerno-app
            # Проверяем, что процесс жив
            pm2 status zerno-app