name: Deploy to Timeweb
on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Confirm an intentional production deployment to Timeweb"
        required: true
        type: boolean
        default: false

concurrency:
  group: zerno-production-deploy
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.confirm_production == true }}
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -Eeuo pipefail
            cd /var/www/app
            PREV=$(git rev-parse HEAD)
            ROLLBACK_ATTEMPTED=0

            rollback() {
              ROLLBACK_ATTEMPTED=1
              echo "Rolling back code to $PREV"
              git reset --hard "$PREV" || return 1
              npm ci || return 1
              BUILD_NUM=$(git rev-list --count HEAD) npm run build:client || return 1
              npm prune --omit=dev || return 1
              pm2 reload zerno-app || return 1
              for i in $(seq 1 15); do
                if curl -fsS http://127.0.0.1:3000/api/ready >/dev/null; then
                  echo "Rollback health check passed"
                  return 0
                fi
                sleep 2
              done
              echo "Rollback health check failed"
              return 1
            }

            on_error() {
              exit_code=$?
              trap - ERR
              if [ "$ROLLBACK_ATTEMPTED" != 1 ]; then
                echo "Deploy preparation failed (exit $exit_code); attempting best-effort rollback"
                rollback || echo "CRITICAL: automatic rollback did not restore a healthy service"
              fi
              exit "$exit_code"
            }
            trap on_error ERR

            git fetch origin
            git reset --hard origin/pizza
            npm ci
            BUILD_NUM=$(git rev-list --count HEAD) npm run build:client
            npm prune --omit=dev
            # Сначала берём явный DB_PATH из окружения PM2, если он был задан при старте.
            # Затем Node загружает .env тем же механизмом, что и npm start (node --env-file=.env server.js).
            PM2_JSON=$(pm2 jlist)
            PM2_DB=$(printf '%s' "$PM2_JSON" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s).find(p=>p.name==='zerno-app');const e=a&&a.pm2_env;process.stdout.write((e&&(e.DB_PATH||(e.env&&e.env.DB_PATH)))||'')})")
            if [ -n "$PM2_DB" ]; then export DB_PATH="$PM2_DB"; fi
            node --env-file=.env scripts/backup-db.mjs

            if ! pm2 reload zerno-app; then
              echo "PM2 reload command failed"
              rollback || echo "CRITICAL: automatic rollback did not restore a healthy service"
              exit 1
            fi

            ok=0
            for i in $(seq 1 15); do
              if curl -fsS http://127.0.0.1:3000/api/ready >/dev/null; then ok=1; break; fi
              sleep 2
            done
            if [ "$ok" != 1 ]; then
              echo "Health check failed after deploy"
              rollback || echo "CRITICAL: automatic rollback did not restore a healthy service"
              exit 1
            fi
            trap - ERR
            pm2 status zerno-app
