name: Visual UX Baseline

on:
  workflow_dispatch:
    inputs:
      production_url:
        description: Public read-only storefront URL
        required: false
        default: https://friday.andcoffee.online
      ref:
        description: Branch or commit to capture against (use pizza for production source comparison)
        required: false
        default: pizza

permissions:
  contents: read

concurrency:
  group: visual-ux-baseline
  cancel-in-progress: true

jobs:
  capture:
    name: Production guest screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout selected source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture read-only guest storefront screens
        run: npx playwright test tests/visual-audit.spec.js --project=chromium --workers=1
        env:
          TEST_URL: ${{ inputs.production_url }}
      - name: Write capture manifest
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const dir = 'artifacts/visual-audit';
          const files = fs.existsSync(dir) ? fs.readdirSync(dir).filter((f) => f.endsWith('.json')) : [];
          const manifest = {
            createdAt: new Date().toISOString(),
            source: 'production-read-only-playwright',
            commit: process.env.GITHUB_SHA,
            ref: process.env.GITHUB_REF_NAME,
            url: process.env.PRODUCTION_URL,
            screenshots: files.map((file) => ({
              metadata: file,
              data: JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'))
            }))
          };
          fs.mkdirSync(dir, { recursive: true });
          fs.writeFileSync(path.join(dir, 'manifest.json'), JSON.stringify(manifest, null, 2));
          NODE
        env:
          PRODUCTION_URL: ${{ inputs.production_url }}
      - name: Upload screenshot baseline
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-ux-baseline-${{ github.run_id }}
          path: artifacts/visual-audit/
          retention-days: 30
