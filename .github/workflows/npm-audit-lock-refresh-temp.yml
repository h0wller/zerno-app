name: Temporary npm audit lock refresh

on:
  push:
    branches:
      - fix/pour-accessibility-audit-2026-11-02

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate package lock with targeted overrides
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean dependency installation
        run: npm ci --no-audit --no-fund

      - name: Verify dependency audit
        id: dependency_audit
        continue-on-error: true
        run: npm audit --audit-level=moderate

      - name: Commit updated lockfile
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: update lockfile for patched transitive dependencies"
          git push origin "HEAD:refs/heads/${BRANCH_NAME}"

      - name: Fail if audit still reports moderate or higher vulnerabilities
        if: steps.dependency_audit.outcome == 'failure'
        run: exit 1
